name: Build Hikari Novel iOS IPA (login fix)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Upstream source commit (default: inspected main version)'
        required: true
        default: 'a9e579a0e2ce8b59a5ec401798110e1de5a37b5c'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      PUB_HOSTED_URL: https://pub.dev
      COCOAPODS_DISABLE_STATS: 'true'

    steps:
      - name: Download upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 15dd/hikari_novel_flutter
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Apply iOS login compatibility fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          patch = r'''diff --git a/lib/common/app_translations.dart b/lib/common/app_translations.dart
          index bbf8a64..bcd0b32 100644
          --- a/lib/common/app_translations.dart
          +++ b/lib/common/app_translations.dart
          @@ -249,7 +249,7 @@ class AppTranslations extends Translations {
                 "no_new_version_available": "已经是最新版本了",
                 "mark_as_read": "标为已读",
                 "mark_as_unread": "标为未读",
          -      "cloudflare_challenge_exception_tip": "当前请求已被Cloudflare的人机验证拦截，这通常是因为你的网络IP不纯净所导致的，请尝试切换其它代理节点，或者关闭代理",
          +      "cloudflare_challenge_exception_tip": "网站要求完成安全验证，请返回登录页完成验证后重试。若验证一直无法完成，请检查网络连接，或在Safari中确认网站是否可以正常打开。",
                 "last_read": "上次阅读",
                 "keyword": "关键词",
                 "search": "搜索",
          @@ -285,7 +285,7 @@ class AppTranslations extends Translations {
                 "chapter_content_loading_tip": "当前章节还在加载中",
                 "copy_all": "复制全部",
                 "free_copy": "自由复制",
          -      "cloudflare_403_exception_tip": "你的IP已被Cloudflare拒绝访问，请使用其他IP进行访问",
          +      "cloudflare_403_exception_tip": "网站拒绝了此请求（HTTP 403）。这不一定表示IP被封禁，请确认登录状态及网站访问权限后重试。",
                 "open_source_license": "开源许可",
                 "para_indent": "首行缩进",
                 "para_spacing": "段距",
          @@ -538,7 +538,7 @@ class AppTranslations extends Translations {
                 "no_new_version_available": "已是最新版本",
                 "mark_as_read": "標為已讀",
                 "mark_as_unread": "標為未讀",
          -      "cloudflare_challenge_exception_tip": "當前請求已被Cloudflare的人機驗證攔截，這通常是因為你的網路IP不純淨所導致的，請嘗試切換其它代理節點，或者關閉代理",
          +      "cloudflare_challenge_exception_tip": "網站要求完成安全驗證，請返回登入頁完成驗證後重試。若驗證一直無法完成，請檢查網路連線，或在Safari中確認網站是否可以正常開啟。",
                 "last_read": "上次閱讀",
                 "keyword": "關鍵詞",
                 "search": "搜尋",
          @@ -574,7 +574,7 @@ class AppTranslations extends Translations {
                 "chapter_content_loading_tip": "目前章節仍在載入中",
                 "copy_all": "複製全部",
                 "free_copy": "自由複製",
          -      "cloudflare_403_exception_tip": "你的IP已被Cloudflare拒絕訪問，請使用其他IP進行訪問",
          +      "cloudflare_403_exception_tip": "網站拒絕了此請求（HTTP 403）。這不一定表示IP被封鎖，請確認登入狀態及網站存取權限後重試。",
                 "open_source_license": "開源許可",
                 "para_indent": "首行縮進",
                 "para_spacing": "段距",
          diff --git a/lib/common/constants.dart b/lib/common/constants.dart
          index d118f4a..1928092 100644
          --- a/lib/common/constants.dart
          +++ b/lib/common/constants.dart
          @@ -5,7 +5,7 @@ const String kAppName = "Hikari Novel";
           
           const String kLatestUrl = "https://api.github.com/repos/15dd/hikari_novel_flutter/releases/latest";
           
          -const Map<String, String> kUserAgent = {
          +final Map<String, String> kUserAgent = {
             "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36 Edg/135.0.0.0",
           };
           
          diff --git a/lib/main.dart b/lib/main.dart
          index 92a7a51..a495a06 100644
          --- a/lib/main.dart
